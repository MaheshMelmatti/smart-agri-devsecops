<!DOCTYPE html>
<html>

<head>

    <title>Smart Agriculture Dashboard</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
            text-align:center;
            padding:20px;
        }

        h1{
            color:#38bdf8;
        }

        .container{
            display:flex;
            justify-content:center;
            gap:20px;
            margin-top:30px;
            flex-wrap:wrap;
        }

        .card{
            background:#1e293b;
            padding:25px;
            border-radius:15px;
            width:220px;
            box-shadow:0px 0px 15px rgba(0,0,0,0.5);
        }

        .value{
            font-size:40px;
            margin-top:10px;
            color:#22c55e;
        }

        .status{
            margin-top:30px;
            font-size:28px;
            color:#facc15;
        }

        canvas{
            margin-top:40px;
            background:white;
            border-radius:10px;
            padding:10px;
        }

    </style>

</head>

<body>

    <h1>Smart Agriculture Monitoring Dashboard</h1>

    <div class="container">

        <div class="card">
            <h2>Soil Moisture</h2>
            <div class="value" id="soil">0</div>
        </div>

        <div class="card">
            <h2>Temperature</h2>
            <div class="value" id="temperature">0</div>
        </div>

        <div class="card">
            <h2>Humidity</h2>
            <div class="value" id="humidity">0</div>
        </div>

    </div>

    <div class="status" id="status">
        STATUS
    </div>

    <canvas id="myChart" width="800" height="300"></canvas>

    <script>

        const ctx = document.getElementById('myChart');

        const chart = new Chart(ctx, {

            type: 'line',

            data: {

                labels: [],

                datasets: [

                    {
                        label: 'Soil Moisture',
                        data: [],
                        borderColor: 'green',
                        fill:false
                    },

                    {
                        label: 'Temperature',
                        data: [],
                        borderColor: 'red',
                        fill:false
                    },

                    {
                        label: 'Humidity',
                        data: [],
                        borderColor: 'blue',
                        fill:false
                    }

                ]
            },

            options: {
                responsive:true
            }

        });

        async function fetchData(){

            const response = await fetch('/metrics-data');

            const data = await response.json();

            document.getElementById('soil').innerHTML =
                data.soil;

            document.getElementById('temperature').innerHTML =
                data.temperature;

            document.getElementById('humidity').innerHTML =
                data.humidity;

            document.getElementById('status').innerHTML =
                data.status;

            const time =
                new Date().toLocaleTimeString();

            chart.data.labels.push(time);

            chart.data.datasets[0].data.push(data.soil);

            chart.data.datasets[1].data.push(data.temperature);

            chart.data.datasets[2].data.push(data.humidity);

            if(chart.data.labels.length > 10){

                chart.data.labels.shift();

                chart.data.datasets.forEach(dataset => {
                    dataset.data.shift();
                });
            }

            chart.update();
        }

        setInterval(fetchData, 5000);

        fetchData();

    </script>

</body>

</html>
